name: firstrung

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      SCOUT_API_URL: http://api:8080
      DATABASE_URL: postgres://firstrung:firstrung@postgres:5432/firstrung
      BETTER_AUTH_URL: ${ROLEATLAS_PUBLIC_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-roleatlas-local-auth-secret-change-before-production}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-RoleAtlas <no-reply@roleatlas.local>}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SCOUT_INTERNAL_SECRET: ${SCOUT_INTERNAL_SECRET:-roleatlas-local-internal-secret-change-before-production}
      AGENT_TOOL_TIMEOUT_MS: ${AGENT_TOOL_TIMEOUT_MS:-20000}
      ROLEATLAS_ADMIN_EMAILS: ${ROLEATLAS_ADMIN_EMAILS:-}
      ROLEATLAS_SKIP_PUBLIC_FEEDS: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api
      - mailpit
    restart: unless-stopped

  nats:
    image: nats:2.12-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: firstrung
      POSTGRES_USER: firstrung
      POSTGRES_PASSWORD: firstrung
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstrung -d firstrung"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  coordinator:
    build:
      context: .
      dockerfile: services/scout/Dockerfile
    command: ["scout-coordinator"]
    environment: &scout_environment
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://firstrung:firstrung@postgres:5432/firstrung
      RUST_LOG: info
      CRAWL_DELAY_MS: "1500"
      REQUEST_TIMEOUT_SECS: "40"
      MAX_BODY_BYTES: "12582912"
      SCOUT_INTERNAL_SECRET: ${SCOUT_INTERNAL_SECRET:-roleatlas-local-internal-secret-change-before-production}
      SCOUT_USER_AGENT: RoleAtlasScout/0.1 (+https://roleatlas.example/crawler; jobs-only)
      SCOUT_SEEDS: ${SCOUT_SEEDS:-}
      RECRAWL_INTERVAL_SECS: ${RECRAWL_INTERVAL_SECS:-21600}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/scout/Dockerfile
    command: ["scout-worker"]
    environment: *scout_environment
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/scout/Dockerfile
    command: ["scout-api"]
    environment: *scout_environment
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

volumes:
  nats_data:
  postgres_data:
