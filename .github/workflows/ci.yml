name: CI

on:
  push:
    branches: [master, workorder-5-global-coverage, codex/production-readiness]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run registry:validate
      - run: npm test
      - run: npm run build

  rust-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: firstrung
          POSTGRES_USER: firstrung
          POSTGRES_PASSWORD: firstrung
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U firstrung -d firstrung"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://firstrung:firstrung@127.0.0.1:5432/firstrung
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: services/scout
      - run: cargo fmt --manifest-path services/scout/Cargo.toml --check
      - run: cargo clippy --manifest-path services/scout/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path services/scout/Cargo.toml
      - run: cargo test --manifest-path services/scout/Cargo.toml --test reconciliation -- --ignored --test-threads=1
      - run: cargo test --manifest-path services/scout/Cargo.toml --test search_sessions -- --ignored --test-threads=1
      - run: cargo test --manifest-path services/scout/Cargo.toml --test search_index -- --ignored --test-threads=1
      - run: cargo test --manifest-path services/scout/Cargo.toml --test ranking_evaluation -- --ignored --test-threads=1
      - run: cargo test --manifest-path services/scout/Cargo.toml --test notifications -- --ignored --test-threads=1
      # Suites share the migration-seeded bootstrap user row, so each runs as
      # its own serial invocation instead of one concurrent test process.
      - run: cargo test --manifest-path services/scout/Cargo.toml --test tenancy -- --ignored --test-threads=1
      - run: cargo test --manifest-path services/scout/Cargo.toml --test daily_workspace -- --ignored --test-threads=1
      - run: cargo test --manifest-path services/scout/Cargo.toml --test migration_upgrade -- --ignored --test-threads=1
      - run: cargo test --manifest-path services/scout/Cargo.toml --test entity_writes -- --ignored --test-threads=1

  # Proves both images build and the scout api settles behind the dev stack,
  # then verifies the web image server-renders behind the real auth gate:
  # anonymous "/" must redirect to /sign-in and /sign-in must render the
  # RoleAtlas shell. Browser/E2E coverage stays out of compose-smoke on
  # purpose; the scout release build dominates runtime, hence the generous
  # timeout.
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Compose v2 ships preinstalled on hosted ubuntu-latest runners; no
      # setup step is needed to build and drive the dev stack.
      - name: Build all images
        run: docker compose -f docker-compose.yml build
      # One shared stack for both proofs; the trap tears it down whenever this
      # step ends, success or failure.
      - name: Probe scout health and the web auth gate on the live stack
        run: |
          set -eu
          ROLEATLAS_PUBLIC_URL=http://localhost:3000 \
            docker compose -f docker-compose.yml up -d --wait --wait-timeout 240 postgres nats api web mailpit
          trap 'docker compose -f docker-compose.yml down -v' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health | grep -q '"status":"ok"'; then
              echo "scout api healthy after ${attempt} probe(s)"
              break
            fi
            if [ "$attempt" = "60" ]; then
              echo "scout api did not become healthy" >&2
              docker compose -f docker-compose.yml logs api postgres nats >&2
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/sign-in || true)
            if [ "$code" = "200" ]; then break; fi
            if [ "$attempt" = "60" ]; then
              echo "web never returned 200 on /sign-in (last: $code)" >&2
              docker compose -f docker-compose.yml logs web postgres api >&2
              exit 1
            fi
            sleep 2
          done
          title=$(curl -fsS http://localhost:3000/sign-in | grep -o '<title>[^<]*</title>' | head -n1)
          case "$title" in
            *RoleAtlas*) echo "sign-in renders the RoleAtlas shell: $title" ;;
            *) echo "unexpected sign-in page title: $title" >&2; exit 1 ;;
          esac
          anon_location=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3000/)
          case "$anon_location" in
            30[27]\ http://localhost:3000/sign-in*) echo "anonymous / redirects to sign-in: $anon_location" ;;
            *) echo "anonymous / must redirect to sign-in, got: $anon_location" >&2; exit 1 ;;
          esac

  # Dependency and secret auditing. Deliberately blocking: every tool here is
  # deterministic, so a red result means a finding, not flakiness. Known
  # baseline at time of writing: npm audit flags four high advisories that all
  # resolve once next moves to 16.3.2 (outside the pinned ^16.2.6 range), so
  # expect this job red until that bump lands.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install cargo-audit from a cached release manifest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-audit
      - name: Scan the Rust lockfile for RustSec advisories
        # RUSTSEC-2023-0071 (rsa Marvin Attack) is recorded in the lockfile only
        # through sqlx's OPTIONAL MySQL driver machinery. The scout build uses
        # sqlx default-features=false with only postgres enabled, so
        # `cargo tree -i rsa` prints "nothing to print": no active graph edge.
        # There is no fixed rsa release; drop this ignore if sqlx ever pulls
        # rsa into the real graph (e.g. mysql feature re-enabled).
        run: >
          cargo audit --file services/scout/Cargo.lock
          --ignore RUSTSEC-2023-0071
      - name: Scan tracked files for credential-shaped literals
        run: |
          set -eu
          # Alternation is ordered so the pattern never starts with a dash;
          # a leading "-----BEGIN" would be parsed as grep options.
          matches=$(git ls-files -z | xargs -0 grep -lEa \
            'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|sk-ant-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            || true)
          if [ -n "$matches" ]; then
            # Filenames only; never echo the matched value into the log.
            printf 'Credential-shaped literal found in:\n%s\n' "$matches" >&2
            exit 1
          fi
          echo "No credential-shaped literals in $(git ls-files | wc -l) tracked files."
